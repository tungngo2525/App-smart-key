; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:yolo_uno]
platform = espressif32
board = yolo_uno
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = time
build_flags = 
	-D ARDUINO_USB_MODE=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-DNFC_INTERFACE_I2C
	-DCORE_DEBUG_LEVEL=0
	-std=gnu++11
	-D SMARTKEY_WIFI_SSID='"shy"'
	-D SMARTKEY_WIFI_PASSWORD='"10091975."'
	-D SMARTKEY_SYNC_BASE_URL='"https://us-central1-smartkey-6502e.cloudfunctions.net"'
	-D SMARTKEY_DEVICE_ID='"CCBA970DEA10CC01"'
	-D SMARTKEY_SYNC_TOKEN='"CCBA970DEA10CC01"'
	-D SMARTKEY_ISSUER_PUBKEY_HEX='"04DEF6B928FE1F5D217DECAE8D3181ACBBC4D5526F98FD7078E02AF11B4B7E7C61BF41BCA332DB023C9F1413E9A2D6BC6889068063D91AC6D644AA60E36CE5F0E0"'

lib_deps = 
	h2zero/NimBLE-Arduino@^2.3.6
	bblanchon/ArduinoJson@^6.21.5
	https://github.com/Seeed-Studio/PN532.git
	https://github.com/thotro/arduino-dw1000.git


