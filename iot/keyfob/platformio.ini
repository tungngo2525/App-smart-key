; PlatformIO Project Configuration File — UWB Key Fob
; Hardware: ESP32 mini (hoặc ESP32-S3 mini) + DW1000 module
;
; Wiring DW1000 → ESP32:
;   SCK  → GPIO 18
;   MOSI → GPIO 23
;   MISO → GPIO 19
;   CS   → GPIO  4
;   IRQ  → GPIO  2
;   RST  → GPIO  5

[env:keyfob]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    https://github.com/thotro/arduino-dw1000.git
